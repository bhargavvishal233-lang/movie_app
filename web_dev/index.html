<!doctype html>
<html lang="en" class="dark intro-active">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MovieApp | AI Powered Movie Recommendations</title>
    <!-- Google Fonts: Inter, Inter Tight, Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
      /* Zero-JS initial boot styles */
      html, body {
        background-color: #000000;
        color: #ffffff;
        margin: 0;
        padding: 0;
      }
      #boot-loader {
        position: fixed;
        inset: 0;
        background: #000000;
        z-index: 9998;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        user-select: none;
        pointer-events: none;
      }
      /* Ensure nothing shows before or behind the preloader on first paint */
      html.intro-active header,
      html.intro-active #hero-banner,
      html.intro-active #hero-skeleton,
      html.intro-active main,
      html.intro-active footer {
        opacity: 0 !important;
        pointer-events: none !important;
      }
    </style>
  </head>
  <body class="bg-black text-white min-h-screen selection:bg-white selection:text-black">

    <div id="boot-loader">

          <span>m</span>

              <circle cx="16" cy="16" r="2" fill="#000000" />
